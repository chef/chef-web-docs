---
# Version of the setting file. Always 0.2
version: '0.2'

# language - current active spelling language
language: en_US

dictionaries:
- 360-docs
- chef
- docs
- hab-docs

dictionaryDefinitions:
- name: 360-docs
  path: https://raw.githubusercontent.com/chef/chef_dictionary/refs/heads/main/360-docs.txt
  description: Custom Chef 360 Dictionary
- name: chef
  path: https://raw.githubusercontent.com/chef/chef_dictionary/main/chef.txt
  description: Custom Chef Dictionary
- name: docs
  path: https://raw.githubusercontent.com/chef/chef_dictionary/main/docs.txt
  description: Custom Docs Dictionary
- name: hab-docs
  path: https://raw.githubusercontent.com/chef/chef_dictionary/main/hab-docs.txt
  description: Custom Habitat Docs Dictionary

# flagWords - list of words to be always considered incorrect
# This is useful for offensive words and common spelling errors.
# For example "hte" should be "the"

flagWords:
- hte

# words - project terms that aren't in the shared Chef dictionaries.
# GitHub product terminology used in the Compliance solution pages.
words:
- CODEOWNERS
- ruleset
- rulesets
# Premium Content profile name tokens.
- administrativeclassified
- administrativepublic
- administrativesensitive
- almalinux
- almalinuxos
- amazonlinux
- apachehttp
- apachetomcat
- applemacos
- appleosx
- awsrds
- backend
- bitlocker
- canonicalubuntu
- cationly
- centoslinux
- ciscoios
- databaseengine
- debianlinux
- disableslowrules
- domaincontroller
- encryptedpass
- enterpriseenvironmentgeneraluse
- enterpriserelease
- esxi
- highsecurity
- ibmaix
- ibmwebsphereliberty
- linuxhostosusingtraditionalauditing
- linuxhostosusingunifiedauditing
- mariadbonlinux
- mariadbrdbms
- mariadbrdbmsonlinux
- memberserver
- microsoftiis
- microsoftsql
- microsoftsqlserver
- microsoftwindows
- microsoftwindowsserver
- missioncritical
- missioncriticalclassified
- missioncriticalpublic
- missioncriticalsensitive
- missionsupport
- missionsupportclassified
- missionsupportpublic
- missionsupportsensitive
- mysqlrdbms
- mysqlrdbmsonlinux
- nextgenerationwindowssecurity
- onedrivesync
- onforuseinthenewesthardwareandconfigurationenvironments
- onforwhenbitlockerisdeployed
- onlinux
- optionaladd
- oracledatabase
- oraclelinux
- oraclemysql
- oraclemysqlcommunity
- oraclesolaris
- postgresqlonlinux
- powershell
- rbvmomi
- rdbms
- rdbmsonhostos
- rdbmsonlinuxhostos
- rdbmsonwindowsserverhostos
- rdbmsusingtraditionalauditing
- rdbmsusingunifiedauditing
- readme
- redhatenterpriselinux
- rockylinux
- sensitivedataenvironmentlimitedfunctionality
- userquerylimit
- waiverfiles
- websphere
- windowsserverhostosusingtraditionalauditing
- windowsserverhostosusingunifiedauditing
- yaml

ignorePaths:
- ".expeditor/**/*"
- "**/*.sh"
- "**/*.svg"
- "**/*.toml"
- "**/*.yml"
- archetypes/*.md
- /package*.json
- _vendor/**/*
- cspell.yaml
- public/**
- node_modules/**
- resources/**
- generated/**
- '*.work'
- '*.work.sum'
- dart-sass/**/*
- tools/**/*
- go.mod
- go.sum
- Makefile

# Ignore patterns list
# https://cspell.org/configuration/patterns/
ignoreRegExpList:
  # ignore URLs with predefined pattern - https://github.com/streetsidesoftware/cspell/blob/main/packages/cspell-lib/src/lib/Settings/RegExpPatterns.ts#L3
- Urls
  # ignore URLs in a Markdown link
- "\\]\\([\\w|/|#|\\.|_|\\-]+\\)"
- "/'s\\b/"
- "/'d\\b/"
- "/^\\s*```[\\s\\S]*?^\\s*```/gm"
- "{{(.+)(?=}})"
