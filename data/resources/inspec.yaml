# Chef InSpec core resource catalog snapshot for the unified /resources page.
#
# Scope: Chef InSpec *core* resources only (bundled with Chef InSpec).
# Source: https://docs.chef.io/inspec/7.1/resources/ (the "Core resources" list).
# Each core resource page lives at /inspec/7.1/resources/core/<name>/.
#
# Cloud and platform resource packs (AWS, Azure, GCP, Docker, Kubernetes, and others)
# are NOT listed here. As of Chef InSpec 7, those resources moved out of core into
# separate resource packs and are grouped on the page from data/resources/inspec_packs.yaml.
#
# This is a point-in-time snapshot; Chef InSpec docs deploy as a separate site and are
# not built from this repository. To regenerate: re-read the "Core resources" list from
# the Chef InSpec resources page and rebuild this map (name -> platform, description, deprecated).
#
# Keyed by resource name so the resources_matrix layout can look up Chef InSpec support.

