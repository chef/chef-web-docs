---
short_name: DependsOnZypperCookbook
full_name: Chef/Modernize/DependsOnZypperCookbook
department: Chef/Modernize
description: Don't depend on the zypper cookbook as the zypper_repository resource
  is built into Chef Infra Client 13.3+
autocorrection: true
target_chef_version: 13.3+
examples: |2-

  # bad
  depends 'zypper'

  # good
  # the resource ships in Chef Infra Client 13.3+, so use it without a depends
  zypper_repository 'apache' do
    baseurl 'https://download.opensuse.org/repositories/Apache'
    action :add
  end
version_added: 5.6.0
enabled: true
excluded_file_paths:
- "**/metadata.rb"
