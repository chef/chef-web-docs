---
short_name: DependsOnLocaleCookbook
full_name: Chef/Modernize/DependsOnLocaleCookbook
department: Chef/Modernize
description: Don't depend on the locale cookbook made obsolete by Chef Infra Client
  14.5. The locale resource is now included in Chef Infra Client itself.
autocorrection: true
target_chef_version: 14.5+
examples: |2-

  # bad
  depends 'locale'

  # good
  # the resource ships in Chef Infra Client 14.5+, so use it without a depends
  locale 'set locale' do
    lang 'en_us.UTF-8'
  end
version_added: 7.19.0
enabled: true
included_file_paths:
- "**/metadata.rb"
