---
short_name: DependsOnWindowsFirewallCookbook
full_name: Chef/Modernize/DependsOnWindowsFirewallCookbook
department: Chef/Modernize
description: Don't depend on the windows_firewall cookbook made obsolete by Chef Infra
  Client 14.7. The windows_firewall resource is now included in Chef Infra Client
  itself.
autocorrection: true
target_chef_version: 14.7+
examples: |2-

  # bad
  depends 'windows_firewall'

  # good
  # the resource ships in Chef Infra Client 14.7+, so use it without a depends
  windows_firewall_rule 'permit ssh' do
    local_port '22'
    protocol 'TCP'
    firewall_action :allow
  end
version_added: 7.19.0
enabled: true
included_file_paths:
- "**/metadata.rb"
