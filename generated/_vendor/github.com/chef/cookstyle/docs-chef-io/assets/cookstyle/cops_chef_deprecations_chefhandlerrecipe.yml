---
short_name: ChefHandlerRecipe
full_name: Chef/Deprecations/ChefHandlerRecipe
department: Chef/Deprecations
description: There is no need to include the empty and deprecated chef_handler::default
  recipe to use the chef_handler resource
autocorrection: true
target_chef_version: All Versions
examples: |2-

  # bad
  include_recipe 'chef_handler'
  include_recipe 'chef_handler::default'

  # good
  # the chef_handler resource ships in Chef Infra Client, so no recipe include is needed
  chef_handler 'MyHandler' do
    source '/etc/chef/handlers/my_handler.rb'
    action :enable
  end
version_added: 6.12.0
enabled: true
excluded_file_paths:
- "**/metadata.rb"
- "**/Berksfile"
